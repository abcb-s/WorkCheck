spring:
  application:
    name: WorkCheck

  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true

  h2:
    console:
      enabled: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

jwt:
  secret: ${JWT_SECRET:workcheck-local-development-jwt-secret-key-change-me}
  access-token-expiration: 1h

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
